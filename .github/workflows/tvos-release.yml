name: tvOS Style Release

# Every app with the tvOS style on one release: the desktop app (Mac, Windows, Linux), Android and the TVs.
# Started by a tvos-v* tag, or by hand with a version. The desktop and Android apps then offer the next
# release themselves, as they update from this repository's releases.
on:
  push:
    tags: ['tvos-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version, as 1.2.0 (the release is tvos-v1.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.names.outputs.version }}
      tag: ${{ steps.names.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: packages/smart-tv/package.json
          sparse-checkout-cone-mode: false
      - id: names
        env:
          INPUT: ${{ inputs.version }}
        run: |
          version="${INPUT:-${GITHUB_REF_NAME#tvos-v}}"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=tvos-v$version" >>"$GITHUB_OUTPUT"
      - env:
          TAG: ${{ steps.names.outputs.tag }}
          VERSION: ${{ steps.names.outputs.version }}
        run: |
          repo="https://github.com/${{ github.repository }}"
          cat >notes.md <<EOF
          Jinbei Studio: AIOStreams with its tvOS style. Pick your device:

          | Device | Download |
          | --- | --- |
          | Mac, Apple silicon | \`jinbei-studio-osx-arm64.pkg\` (Intel: \`-osx-x64.pkg\`). Not signed by Apple: the first time, allow it in System Settings, Privacy & Security, Open Anyway. |
          | Windows | \`jinbei-studio-win-x64.exe\` (Arm PCs: \`-win-arm64.exe\`). If Windows warns: More info, Run anyway. |
          | Linux | \`jinbei-studio-linux-x64.flatpak\` (installed with \`flatpak install --user\`; it doesn't update itself) |
          | Android, Android TV | \`jinbei-studio-android-arm64-v8a.apk\` (most devices) |
          | LG TV (webOS) | \`jinbei-studio-webos-*.ipk\`, installed with Developer Mode or the Homebrew Channel |
          | Samsung TV (Tizen) | \`jinbei-studio-tizen-*.wgt\` |

          The Mac, Windows and Android apps offer the next version themselves.
          The style can be switched off in Settings, Theme, Interface.
          EOF
          gh release view "$TAG" -R "$repo" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$repo" --target "$GITHUB_SHA" --title "tvOS style $VERSION" --notes-file notes.md

  desktop:
    needs: release
    uses: ./.github/workflows/desktop-build.yml
    with:
      version: ${{ needs.release.outputs.version }}
      channel: stable
      release: ${{ needs.release.outputs.tag }}

  android:
    needs: release
    uses: ./.github/workflows/android-build.yml
    secrets: inherit
    with:
      version: ${{ needs.release.outputs.version }}
      channel: stable
      release: ${{ needs.release.outputs.tag }}

  tv:
    needs: release
    uses: ./.github/workflows/smart-tv-build.yml
    with:
      release: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}

  # The TV packages on the tvOS release too, so every download is on one page.
  tv-files:
    needs: [release, tv]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: jinbei-studio-*
          merge-multiple: true
          path: tv
      - run: |
          ls tv
          gh release upload "${{ needs.release.outputs.tag }}" -R "${{ github.repository }}" tv/*.ipk tv/*.wgt --clobber

  # The web app as a server hosts it, for a server to serve at its `/web` in place of the stock one.
  web-page:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@aiostreams/web..."
      - run: pnpm -F @aiostreams/web build
        env:
          JINBEI_VERSION: ${{ needs.release.outputs.version }}
      - run: |
          (cd packages/web/dist && zip -qr "$GITHUB_WORKSPACE/jinbei-studio-web.zip" .)
          ls -l jinbei-studio-web.zip
          gh release upload "${{ needs.release.outputs.tag }}" -R "${{ github.repository }}" jinbei-studio-web.zip --clobber
